<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finca Amaro - Gestión Ganadera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo_marca.png" alt="Marca Finca Amaro" id="logo">
        <h1>Finca Amaro</h1>
        <nav>
            <a href="#inventario">Inventario</a>
            <a href="#registro">Registrar Res</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section id="acerca-de">
        <h2>Acerca de Nosotros</h2>
        <p>Bienvenidos a Finca Amaro, especialistas en genética de alta calidad.</p>
    </section>

    <section id="inventario">
        <h2>Aforo de Ganado</h2>
        <div class="filtros">
            <input type="text" placeholder="Buscar por código o nombre (ej. Maggie)">
            <select>
                <option value="">Todas las Razas</option>
                <option value="brahman">Brahman</option>
                <option value="guzerat">Guzerat</option>
                <option value="nelore">Nelore</option>
            </select>
        </div>

        <div id="contenedor-reses">
            <p>Cargando inventario...</p>
        </div>
    </section>

    <footer id="contacto">
        <p>Contacto: WhatsApp +57 XXX XXX XXXX | Ubicación: Corral 1, 2 y 3</p>
    </footer>

</body>
</html>
