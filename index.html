<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finca Amaro - Próximamente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f1ea; /* Un color crema tierra */
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #a0522d; /* Color siena/madera */
            padding: 40px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #5d4037; }
        p { font-size: 1.2rem; line-height: 1.6; }
        .highlight { font-weight: bold; color: #2e7d32; } /* Verde campo */
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido a Finca Amaro</h1>
        <p>Acá empieza el proyecto de <span class="highlight">Diego</span></p>
        <p>Trazabilidad, genética y calidad.</p>
        <hr>
        <p>Meta establecida: <span class="highlight">Finca 2032</span></p>
    </div>
</body>
</html>
